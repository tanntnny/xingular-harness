name: Release

# Publishes when a version tag such as v0.1.3 is pushed. `npm version patch` creates the tag,
# so a release is: npm version patch && git push --follow-tags
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: The tag must match package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run ci
      - name: Upgrade npm (trusted publishing needs 11.5.1 or newer)
        run: npm install -g npm@^11.5.1
      - name: Publish with provenance
        run: npm publish --provenance --access public
