name: CI

on:
  push:
    branches: [main, harness2, 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: npm ci
      - run: npx --no-install playwright-core install --with-deps chromium
      - run: npm run ci
      - run: npm run release:pack -- outputs/ci-candidate
      - name: Smoke-test the packaged release
        run: |
          version=$(node -p "require('./package.json').version")
          npm run release:smoke -- "outputs/ci-candidate/xingular-harness-${version}.tgz" --terminal
      - uses: actions/upload-artifact@v4
        with:
          name: harness-ci-${{ matrix.os }}
          path: outputs/ci-candidate/
          if-no-files-found: error
