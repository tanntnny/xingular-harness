name: Release

# Stable and unstable candidates are reviewed before tagging; this workflow retests the exact candidate and waits at the separate publish gate.
# Temporary for 1.3.1-unstable.4: the `check` job is removed and publication does not wait for the
# smoke job, so this tag publishes without the suites by request. Restore both right after publication.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: npm ci
      - run: npm run release:pack -- outputs/release
      - uses: actions/upload-artifact@v4
        with:
          name: harness-candidate
          path: outputs/release/
          if-no-files-found: error

  smoke:
    needs: candidate
    # Evidence only for this tag: publish does not wait for it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/download-artifact@v4
        with:
          name: harness-candidate
          path: outputs/release
      - name: Smoke-test the exact candidate tarball
        run: |
          version=$(node -p "require('./package.json').version")
          npm run release:smoke -- "outputs/release/xingular-harness-${version}.tgz" --terminal

  publish:
    needs: [candidate]
    # Configure required reviewers here; this approval gates publication, not pre-tag candidate review.
    environment: npm-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: npm install --global npm@11.19.1
      - uses: actions/download-artifact@v4
        with:
          name: harness-candidate
          path: outputs/release
      - run: npm run release:preflight -- --tagged
      - name: Check candidate integrity
        working-directory: outputs/release
        run: sha256sum --check SHA256SUMS
      - name: Publish the tested tarball with provenance
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-unstable.* ]]; then npm_tag=unstable; else npm_tag=latest; fi
          npm publish "./outputs/release/xingular-harness-${version}.tgz" --ignore-scripts --provenance --access public --tag "$npm_tag"
      - name: Verify published package
        run: node scripts/release-verify.mjs outputs/release/candidate.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          release_options=()
          if [[ "$version" == *-unstable.* ]]; then release_options+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "outputs/release/xingular-harness-${version}.tgz" outputs/release/SHA256SUMS --verify-tag --title "Xingular Harness ${version}" --notes-file "docs/releases/${version}.md" "${release_options[@]}"
