name: Release

# The candidate is reviewed before tagging; this workflow retests it and waits at the separate publish gate.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Match the release tag
        run: node --input-type=module -e "import p from './package.json' with {type:'json'}; if (process.env.GITHUB_REF_NAME !== 'v' + p.version) process.exit(1)"
      - run: npm ci
      - run: npx --no-install playwright-core install --with-deps chromium
      - name: Install bubblewrap for Linux sandbox verification
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          test -x /usr/bin/bwrap
          # Ubuntu 24.04 runners block unprivileged user namespaces, so bwrap cannot start without this.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run ci

  candidate:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: npm ci
      - run: npm run release:pack -- outputs/release
      - uses: actions/upload-artifact@v4
        with:
          name: harness-candidate
          path: outputs/release/
          if-no-files-found: error

  smoke:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/download-artifact@v4
        with:
          name: harness-candidate
          path: outputs/release
      - name: Smoke-test the exact candidate tarball
        run: |
          version=$(node -p "require('./package.json').version")
          npm run release:smoke -- "outputs/release/xingular-harness-${version}.tgz" --terminal

  publish:
    needs: [candidate, smoke]
    # Configure required reviewers here; this approval gates publication, not pre-tag candidate review.
    environment: npm-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: npm install --global npm@11.19.1
      - uses: actions/download-artifact@v4
        with:
          name: harness-candidate
          path: outputs/release
      - run: npm run release:preflight -- --tagged
      - name: Check candidate integrity
        working-directory: outputs/release
        run: sha256sum --check SHA256SUMS
      - name: Publish the tested tarball with provenance
        run: |
          version=$(node -p "require('./package.json').version")
          npm publish "./outputs/release/xingular-harness-${version}.tgz" --ignore-scripts --provenance --access public --tag latest
      - name: Verify published package
        run: node scripts/release-verify.mjs outputs/release/candidate.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create "$GITHUB_REF_NAME" "outputs/release/xingular-harness-${version}.tgz" outputs/release/SHA256SUMS --verify-tag --title "Xingular Harness ${version}" --notes-file "docs/releases/${version}.md"
